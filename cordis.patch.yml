# dsh-web-search-aggregation bundle layer.
#
# 1. Pin the web seam's search provider to this plugin's aggregated provider
#    (id 'aggregated'). A patch replaces the targeted row's WHOLE config, so
#    every web-row key this deployment needs must be restated verbatim; this
#    plugin intentionally states only `searchProvider` — it owns the search
#    selection and nothing else. A deployment that also pins a fetchProvider
#    (e.g. dsh-web-fetch-playwright's) should state both keys in the layer
#    applied LAST (the profile's own cordis.patch.yml wins over every bundle
#    layer); when this plugin's layer is last, an unconfigured fetchProvider
#    resolves to the single registered fetch provider automatically.
# 2. Take over the shipped search slot: disable the built-in
#    '@deepseek-ai/dsh-web-search-deepseek' row so its 'deepseek-official'
#    provider never registers (its settings card disappears with it). This
#    disable is order-stable: a patch replaces a row's config, not its other
#    keys, and no shipped layer re-enables this row; users can restore the
#    built-in provider from their own profile layer with `disabled: false`.
#    A custom profile without the dsh-base row just logs a loader warning
#    ("patch: entry web-search-deepseek not found") and continues.
#
#    ORDERING CAVEAT: this disable makes the `searchProvider: aggregated` pin
#    above LOAD-BEARING. A later bundle layer that re-states the shipped
#    selection (dsh-web-fetch-playwright's does — it must restate
#    `searchProvider` because patches replace whole configs) would leave the
#    seam configured for 'deepseek-official' with that provider unloaded, and
#    every web_search would fail with WEB_PROVIDER_CONFIGURED_MISSING. In such
#    a deployment, order this plugin LAST in dsh.profile.bundles or re-pin
#    both keys in the profile's own cordis.patch.yml.
# 3. Insert this package's host plugin row. The queue itself lives in the
#    'web-search-aggregation' settings section (editable live from
#    Settings → Plugins → Plugin configuration); the composition entry below
#    carries the shipped default queue as the section's base layer. API keys
#    are NOT part of the entry: each kind reads exactly one fixed credential
#    (ANYSEARCH_API_KEY / TINYFISH_API_KEY / TAVILY_API_KEY /
#    BRAVE_SEARCH_API_KEY / EXA_API_KEY / FIRECRAWL_API_KEY /
#    JINA_API_KEY / SERPAPI_API_KEY / SERPER_API_KEY) whose value holds all of
#    that provider's keys joined by ','.
#
# Bundle layers load at the next profile start; the settings section hot-reloads.
- id: web
  config:
    searchProvider: aggregated

- id: web-search-deepseek
  disabled: true

- insert:
    - id: web-search-aggregation
      name: dsh-web-search-aggregation
      config:
        providers:
          - kind: anysearch
            enabled: true
          - kind: firecrawl
            enabled: true
          - kind: tavily
            enabled: true
          - kind: tinyfish
            enabled: true
          - kind: brave
            enabled: true
          - kind: exa
            enabled: true
          - kind: jina
            enabled: true
          - kind: serpapi
            enabled: true
          - kind: serper
            enabled: true
        attemptTimeoutMs: 10000
