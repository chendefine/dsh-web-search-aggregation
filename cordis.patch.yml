# dsh-web-search-aggregation bundle layer.
#
# 1. Pin the web seam's search provider to this plugin's aggregated provider
#    (id 'aggregated'). A patch replaces the targeted row's WHOLE config, so
#    every web-row key this deployment needs must be restated verbatim; this
#    plugin intentionally states only `searchProvider` — it owns the search
#    selection and nothing else. A deployment that also pins a fetchProvider
#    (e.g. dsh-web-fetch-playwright's) should state both keys in the layer
#    applied LAST (the profile's own cordis.patch.yml wins over every bundle
#    layer); when this plugin's layer is last, an unconfigured fetchProvider
#    resolves to the single registered fetch provider automatically.
# 2. Insert this package's host plugin row. The queue itself lives in the
#    'web-search-aggregation' settings section (editable live from
#    Settings → Plugins → Plugin configuration); the composition entry below
#    carries the shipped default queue as the section's base layer. API keys
#    are NOT part of the entry: each kind reads exactly one fixed credential
#    (ANYSEARCH_API_KEY / TINYFISH_API_KEY / TAVILY_API_KEY /
#    BRAVE_SEARCH_API_KEY / EXA_API_KEY / FIRECRAWL_API_KEY /
#    JINA_API_KEY / SERPAPI_API_KEY / SERPER_API_KEY) whose value holds all of
#    that provider's keys joined by ','.
#
# Bundle layers load at the next profile start; the settings section hot-reloads.
- id: web
  config:
    searchProvider: aggregated

- insert:
    - id: web-search-aggregation
      name: dsh-web-search-aggregation
      config:
        providers:
          - kind: anysearch
            enabled: true
          - kind: tavily
            enabled: true
          - kind: tinyfish
            enabled: true
          - kind: brave
            enabled: true
          - kind: exa
            enabled: true
          - kind: firecrawl
            enabled: true
          - kind: jina
            enabled: true
          - kind: serpapi
            enabled: true
          - kind: serper
            enabled: true
        attemptTimeoutMs: 10000
